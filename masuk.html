<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronexzz</title>
    <!-- Google Fonts: Plus Jakarta Sans & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #b5b5b5;
            --popup-bg: rgba(255, 255, 255, 0.7);
            --popup-bg-hover: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(255, 255, 255, 0.8);
            --border-glow: rgba(0, 196, 72, 0.4);
            --shadow-glass: 0 25px 50px -12px rgba(0, 0, 0, 0.15), inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
            --btn-green: #00c448;
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Tema Gelap (Hitam Pekat / True Black) dengan Liquid Glass */
        [data-theme="dark"] {
            --bg-color: #000000;
            --popup-bg: rgba(18, 18, 18, 0.65);
            --popup-bg-hover: rgba(26, 26, 26, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(22, 163, 74, 0.4);
            --shadow-glass: 0 35px 70px -15px rgba(0, 0, 0, 0.9), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            --btn-green: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, transform 0.4s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND CAIR / GRADIENT AMBIENT UNTUK EFEK LIQUID GLASS --- */
        body::before {
            content: '';
            position: fixed;
            top: -15%;
            left: -15%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(0, 196, 72, 0.18) 0%, rgba(37, 99, 235, 0.06) 50%, transparent 70%);
            z-index: 0;
            filter: blur(90px);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -15%;
            right: -15%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0, 196, 72, 0.05) 50%, transparent 70%);
            z-index: 0;
            filter: blur(90px);
            pointer-events: none;
        }

        /* Tombol Ganti Tema di Pojok Atas */
        .top-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .icon-btn {
            background: var(--popup-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: var(--shadow-glass);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .icon-btn:hover {
            border-color: var(--border-glow);
            transform: scale(1.08);
            background: var(--popup-bg-hover);
        }

        /* Animasi Bergerak-gerak di Tengah (Floating & Subtle Bounce) */
        @keyframes floatBounce {
            0% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-8px) scale(1.01);
            }
            100% {
                transform: translateY(0px) scale(1);
            }
        }

        @keyframes popUpScale {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Container Popup Liquid Glass Tengah */
        .popup-card {
            background: var(--popup-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 32px 26px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-glass);
            position: relative;
            z-index: 5;
            overflow: hidden;
            animation: popUpScale 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatBounce 4s ease-in-out infinite 0.5s;
        }

        /* Kilauan Cahaya Efek Cair (Liquid Shimmer) */
        .popup-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.12),
                transparent
            );
            transition: 0.6s;
            pointer-events: none;
        }

        .popup-card:hover::before {
            left: 150%;
        }

        .popup-card:hover {
            border-color: var(--border-glow);
            background: var(--popup-bg-hover);
        }

        /* Tombol Close (X) di Pojok Kanan Atas Kartu */
        .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 800;
            transition: var(--transition-smooth);
            text-decoration: none;
        }

        .close-btn:hover {
            background: var(--btn-green);
            color: #000000;
            border-color: var(--btn-green);
            transform: scale(1.08);
        }

        /* Konten Teks */
        .popup-header h2 {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
            padding-right: 35px;
        }

        .popup-header p {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 500;
            margin-bottom: 24px;
        }

        /* Tombol Aksi Utama (Masuk) */
        .action-btn {
            display: block;
            width: 100%;
            background: var(--btn-green);
            color: #000000;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 14px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 196, 72, 0.3);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 196, 72, 0.4);
            filter: brightness(1.05);
        }

        .action-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Tombol Ganti Tema di Pojok Atas -->
    <div class="top-actions">
        <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Ganti Tema">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <!-- Kotak Popup Utama dengan Efek Liquid Glass & Bergerak-gerak -->
    <div class="popup-card">
        <a href="portofolio.html" class="close-btn" title="Tutup">
            <i class="fa-solid fa-xmark"></i>
        </a>
        
        <div class="popup-header">
            <h2>Halo, ini Bilal Dev</h2>
            <p>Ketuk masuk untuk melanjutkan ke portofolio.</p>
        </div>

        <a href="portofolio.html" class="action-btn">
            Masuk
        </a>
    </div>

    <!-- Script Sinkronisasi Tema -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        const htmlTag = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');

        if (savedTheme === 'dark') {
            htmlTag.setAttribute('data-theme', 'dark');
            if (themeIcon) themeIcon.className = 'fa-solid fa-sun';
        } else {
            htmlTag.removeAttribute('data-theme');
            if (themeIcon) themeIcon.className = 'fa-solid fa-moon';
        }

        function toggleTheme() {
            if (htmlTag.getAttribute('data-theme') === 'dark') {
                htmlTag.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                if (themeIcon) themeIcon.className = 'fa-solid fa-moon';
            } else {
                htmlTag.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                if (themeIcon) themeIcon.className = 'fa-solid fa-sun';
            }
        }
    </script>

</body>
</html>
